spring.application.name=ElBuenSaborBack

# Credenciales y secrets reales viven en application-local.properties (NO versionado).
# Ver application-local.properties.example para la plantilla de claves requeridas.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/elbuensaborbp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

cloudinary.cloud_name=dqxon8ow7

# Fotos de productos: el límite real (5 MB) lo valida ImagenController; estos valores solo
# tienen que ser un poco mayores para que el error llegue con un mensaje claro.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# mercadopago.access-token y .webhook-secret van en application-local.properties: son
# por-desarrollador. La URL del webhook (ngrok, cambia en cada reinicio) se configura en el
# panel de la aplicación de Mercado Pago, no acá. Si faltan, el arranque no falla (a diferencia del secret de
# JWT): solo los endpoints de /pagos van a devolver error hasta que se configuren.
mercadopago.back-url-success=http://localhost:5173/pago/exito
mercadopago.back-url-pending=http://localhost:5173/pago/pendiente
mercadopago.back-url-failure=http://localhost:5173/pago/error
